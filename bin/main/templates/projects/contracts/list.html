<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/vertical}">
<head>
    <th:block layout:fragment="page-meta" th:replace="~{partials/page-meta :: page-meta('수임 관리')}" />
    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf}"/>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="container-fluid">
            <th:block th:replace="~{partials/page-title :: page-title('수임 관리', '계약 관리')}" />
            <div class="row">
                <div class="col-12">
                    <div data-table data-table-rows-per-page="10" class="card">
                        <!-- Header with Search and Filter -->
                        <div class="card-header border-light justify-content-between d-flex flex-wrap gap-2">
                            <!-- Left: Attorney Name Search -->
                            <div class="d-flex gap-2">
                                <form id="searchForm" th:action="@{/contracts}" method="get" class="app-search">
                                    <div class="input-group">
                                        <input type="search" class="form-control" name="attorneyName" th:value="${param.attorneyName}" placeholder="담당 변호사 검색...">
                                        <i data-lucide="search" class="app-search-icon text-muted"></i>
                                    </div>
                                    <input type="hidden" name="status" th:value="${param.status}" th:if="${param.status != null}">
                                </form>
                            </div>

                            <!-- Right: Status Filter -->
                            <div class="d-flex align-items-center gap-2">
                                <span class="me-2 fw-semibold">Filter By:</span>
                                <form id="filterForm" th:action="@{/contracts}" method="get" class="d-flex align-items-center gap-2">
                                    <input type="hidden" name="attorneyName" th:value="${param.attorneyName}" th:if="${param.attorneyName != null}">
                                    
                                    <div class="app-search">
                                        <select name="status" class="form-select form-control my-1 my-md-0" onchange="this.form.submit()">
                                            <option value="">전체 상태</option>
                                            <option th:each="s : ${T(com.haeil.full.contract.domain.type.ContractStatus).values()}"
                                                    th:value="${s}"
                                                    th:text="${s.label}"
                                                    th:selected="${param.status != null and param.status[0] == s.name()}">
                                            </option>
                                        </select>
                                        <i data-lucide="list-filter" class="app-search-icon text-muted"></i>
                                    </div>
                                </form>

                                <div>
                                    <select class="form-select form-control my-1 my-md-0" onchange="location.href='?size='+this.value">
                                        <option value="10" th:selected="${param.size == null or param.size[0] == '10'}">10</option>
                                        <option value="20" th:selected="${param.size != null and param.size[0] == '20'}">20</option>
                                        <option value="50" th:selected="${param.size != null and param.size[0] == '50'}">50</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Contents -->
                        <div class="table-responsive">
                            <table class="table table-custom table-centered table-select table-hover w-100 mb-0">
                                <thead class="bg-light align-middle bg-opacity-25 thead-sm">
                                    <tr class="text-uppercase fs-xxs">
                                        <th class="ps-3" style="width: 1%;">
                                            <input data-table-select-all
                                                class="form-check-input form-check-input-light fs-14 mt-0"
                                                type="checkbox" id="select-all-files" value="option">
                                        </th>
                                        <th>사건 번호</th>
                                        <th>의뢰인명</th>
                                        <th>담당 변호사</th>
                                        <th style="width: 150px;">상태</th>
                                        <th>수임계약서</th>
                                        <th>입금 기한</th>
                                        <th class="text-center" style="width: 1%;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="contract : ${contracts}">
                                        <td class="ps-3"><input
                                                class="form-check-input form-check-input-light fs-14 file-item-check mt-0"
                                                type="checkbox" value="option"></td>
                                        <td>
                                            <span class="fw-bold text-primary" th:text="'C' + ${contract.caseId}"></span>
                                        </td>
                                        <td th:text="${contract.clientName}"></td>
                                        <td th:text="${contract.attorneyName}"></td>
                                        <td>
                                            <!-- Contract exists -->
                                            <select class="form-select form-select-sm" 
                                                    th:if="${contract.contractId != null}"
                                                    th:onchange="|updateStatus(${contract.contractId}, this)|"
                                                    th:classappend="${contract.status.name() == 'AWAITING' ? 'bg-light text-secondary' : (contract.status.name() == 'PENDING' ? 'bg-warning-subtle text-warning' : 'bg-success-subtle text-success')}">
                                                <option th:each="status : ${T(com.haeil.full.contract.domain.type.ContractStatus).values()}"
                                                        th:value="${status}"
                                                        th:text="${status.label}"
                                                        th:selected="${status == contract.status}"
                                                        class="bg-white text-dark">
                                                </option>
                                            </select>
                                            <!-- No contract -->
                                            <select class="form-select form-select-sm bg-light text-secondary" disabled th:if="${contract.contractId == null}">
                                                <option selected>수임대기</option>
                                            </select>
                                        </td>
                                        <td>
                                            <a th:if="${contract.contractId != null}" th:href="@{/contracts/{id}(id=${contract.contractId})}" class="btn btn-sm btn-soft-primary">
                                                <i class="ti ti-file-text me-1"></i> 보기
                                            </a>
                                            <a th:if="${contract.contractId == null}" th:href="@{/contracts/new(caseId=${contract.caseId}, caseNumber=${contract.caseNumber})}" class="btn btn-sm btn-soft-secondary">
                                                <i class="ti ti-file-plus me-1"></i> 작성
                                            </a>
                                        </td>
                                        <td th:text="${contract.dueDate != null ? #temporals.format(contract.dueDate, 'yyyy-MM-dd') : '-'}"></td>
                                        <td>
                                            <div class="d-flex justify-content-center gap-1">
                                                <a th:if="${contract.contractId != null}" th:href="@{/contracts/{id}(id=${contract.contractId})}" class="btn btn-light btn-icon btn-sm rounded-circle"><i class="ti ti-eye fs-lg"></i></a>
                                                <button type="button" class="btn btn-light btn-icon btn-sm rounded-circle" disabled th:if="${contract.contractId == null}"><i class="ti ti-eye fs-lg"></i></button>
                                                
                                                <a href="#" class="btn btn-light btn-icon btn-sm rounded-circle"><i class="ti ti-edit fs-lg"></i></a>
                                                <a href="#" class="btn btn-light btn-icon btn-sm rounded-circle"><i class="ti ti-trash fs-lg"></i></a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${contracts.empty}">
                                        <td colspan="8" class="text-center py-5 text-muted">
                                            등록된 수임 내역이 없습니다.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                            
                        <!-- Pagination -->
                        <div class="d-flex justify-content-center mt-4" th:if="${!contracts.empty}">
                            <nav aria-label="Page navigation">
                                <ul class="pagination">
                                    <li class="page-item" th:classappend="${contracts.first} ? 'disabled'">
                                        <a class="page-link" th:href="@{/contracts(page=${contracts.number - 1})}">
                                            <i class="ti ti-chevron-left"></i>
                                        </a>
                                    </li>
                                    <li class="page-item disabled">
                                        <span class="page-link" th:text="${contracts.number + 1} + ' / ' + ${contracts.totalPages}"></span>
                                    </li>
                                    <li class="page-item" th:classappend="${contracts.last} ? 'disabled'">
                                        <a class="page-link" th:href="@{/contracts(page=${contracts.number + 1})}">
                                            <i class="ti ti-chevron-right"></i>
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            function updateStatus(contractId, selectElement) {
                const status = selectElement.value;
                const csrfTokenMeta = document.querySelector("meta[name='_csrf']");
                const csrfHeaderMeta = document.querySelector("meta[name='_csrf_header']");
                
                const headers = {
                    'Content-Type': 'application/x-www-form-urlencoded'
                };

                if (csrfTokenMeta && csrfHeaderMeta) {
                    headers[csrfHeaderMeta.getAttribute("content")] = csrfTokenMeta.getAttribute("content");
                }

                fetch('/contracts/' + contractId + '/status?status=' + status, {
                    method: 'PATCH',
                    headers: headers
                })
                .then(response => {
                    if (response.ok) {
                        updateSelectStyle(selectElement, status);
                    } else {
                        alert('상태 변경에 실패했습니다.');
                        location.reload();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                    location.reload();
                });
            }

            function updateSelectStyle(element, status) {
                element.classList.remove(
                    'bg-light', 'text-secondary', 
                    'bg-warning-subtle', 'text-warning', 
                    'bg-success-subtle', 'text-success'
                );
                
                if (status === 'AWAITING') {
                    element.classList.add('bg-light', 'text-secondary');
                } else if (status === 'PENDING') {
                    element.classList.add('bg-warning-subtle', 'text-warning');
                } else if (status === 'COMPLETED') {
                    element.classList.add('bg-success-subtle', 'text-success');
                }
            }
        </script>
    </th:block>
</body>
</html>
