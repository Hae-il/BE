<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/vertical}">
<head>
    <th:block layout:fragment="page-meta" th:replace="~{partials/page-meta :: page-meta('수임계약서 작성')}" />
</head>
<body>
    <th:block layout:fragment="content">
        <div class="container-fluid">
            <th:block th:replace="~{partials/page-title :: page-title('수임계약서 작성', '계약 관리')}" />

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title">수임계약서 작성</h4>
                        </div>
                        <div class="card-body">
                            <form class="needs-validation" th:action="@{/contracts}" method="post" novalidate>
                                <!-- Hidden fields might be needed for caseId etc if passing via model -->
                                <input type="hidden" name="caseId" th:value="${caseId}">

                                <h5 class="mb-3 text-uppercase bg-light p-2"><i class="ti ti-file-text me-1"></i> 계약 기본 정보</h5>
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3">
                                        <label for="caseNumber" class="form-label">사건 번호</label>
                                        <input type="text" class="form-control" id="caseNumber" th:value="${caseNumber}" readonly>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="dueDate" class="form-label">입금 기한 <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="dueDate" name="dueDate" required>
                                        <div class="invalid-tooltip">
                                            입금 기한을 선택해주세요.
                                        </div>
                                    </div>
                                </div>

                                <h5 class="mb-3 text-uppercase bg-light p-2"><i class="ti ti-coin me-1"></i> 수임료 정보</h5>
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">수임료 유형 <span class="text-danger">*</span></label>
                                        <select class="form-select" id="feeType" name="feeType" required onchange="toggleFeeInputs()">
                                            <option value="" selected disabled>선택하세요</option>
                                            <option value="FIXED">정액 (Fixed Fee)</option>
                                            <option value="PERCENTAGE">정률 (Percentage Fee)</option>
                                        </select>
                                        <div class="invalid-tooltip">
                                            수임료 유형을 선택해주세요.
                                        </div>
                                    </div>
                                </div>

                                <!-- Fixed Fee Inputs -->
                                <div id="fixedFeeSection" style="display: none;">
                                    <div class="mb-3">
                                        <label class="form-label">계약 조건 및 금액</label>
                                        <div id="conditionList">
                                            <div class="row mb-2 align-items-center condition-row">
                                                <div class="col-md-7">
                                                    <input type="text" class="form-control" name="contractConditionRequestList[0].conditionDetail" placeholder="조건 내용 (예: 착수금)" required>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="input-group">
                                                        <input type="number" class="form-control" name="contractConditionRequestList[0].amount" placeholder="금액" required>
                                                        <span class="input-group-text">원</span>
                                                    </div>
                                                </div>
                                                <div class="col-md-1">
                                                    <button type="button" class="btn btn-soft-success btn-icon btn-sm" onclick="addCondition()">
                                                        <i class="ti ti-plus"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Percentage Fee Inputs -->
                                <div id="percentageFeeSection" style="display: none;">
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="targetAmount" class="form-label">목표 금액 (소송가액) <span class="text-danger">*</span></label>
                                            <div class="input-group">
                                                <input type="number" class="form-control" id="targetAmount" name="targetAmount" required>
                                                <span class="input-group-text">원</span>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="feePercentage" class="form-label">수임 비율 <span class="text-danger">*</span></label>
                                            <div class="input-group">
                                                <input type="number" class="form-control" id="feePercentage" name="feePercentage" step="0.1" required>
                                                <span class="input-group-text">%</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <h5 class="mb-3 text-uppercase bg-light p-2"><i class="ti ti-receipt me-1"></i> 비용 처리</h5>
                                <div class="row mb-4">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">비용 처리 방식 <span class="text-danger">*</span></label>
                                        <select class="form-select" name="expenseInfoRequest.expenseHandling" required>
                                            <option value="" selected disabled>선택하세요</option>
                                            <option value="BILLED_SEPARATELY">별도 정산</option>
                                            <option value="INCLUDED_IN_RETAINER">착수금에 포함</option>
                                        </select>
                                    </div>
                                    <div class="col-md-12 mb-3">
                                        <label class="form-label">비용 상세 내용</label>
                                        <textarea class="form-control" name="expenseInfoRequest.expenseDetail" rows="3" placeholder="비용 처리에 대한 상세 내용을 입력하세요."></textarea>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 mt-4">
                                    <a href="/contracts" class="btn btn-light">취소</a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="ti ti-check me-1"></i> 계약서 작성 완료
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block layout:fragment="javascripts">
        <script th:inline="javascript">
            // Fee Type Toggle
            function toggleFeeInputs() {
                const feeType = document.getElementById('feeType').value;
                const fixedSection = document.getElementById('fixedFeeSection');
                const percentageSection = document.getElementById('percentageFeeSection');

                // Helper to enable/disable inputs inside a container
                const setInputsDisabled = (container, isDisabled) => {
                    const inputs = container.querySelectorAll('input, select, textarea, button');
                    inputs.forEach(el => {
                         el.disabled = isDisabled;
                    });
                };

                if (feeType === 'FIXED') {
                    fixedSection.style.display = 'block';
                    percentageSection.style.display = 'none';
                    setInputsDisabled(fixedSection, false);
                    setInputsDisabled(percentageSection, true);
                } else if (feeType === 'PERCENTAGE') {
                    fixedSection.style.display = 'none';
                    percentageSection.style.display = 'block';
                    setInputsDisabled(fixedSection, true);
                    setInputsDisabled(percentageSection, false);
                } else {
                    fixedSection.style.display = 'none';
                    percentageSection.style.display = 'none';
                    setInputsDisabled(fixedSection, true);
                    setInputsDisabled(percentageSection, true);
                }
            }

            // Initialize on load
            document.addEventListener('DOMContentLoaded', function() {
                toggleFeeInputs();
            });

            // Add Condition Row (Dynamic inputs)
            let conditionIndex = 1;
            function addCondition() {
                const container = document.getElementById('conditionList');
                const newRow = document.createElement('div');
                newRow.className = 'row mb-2 align-items-center condition-row';
                newRow.innerHTML = `
                    <div class="col-md-7">
                        <input type="text" class="form-control" name="contractConditionRequestList[${conditionIndex}].conditionDetail" placeholder="조건 내용" required>
                    </div>
                    <div class="col-md-4">
                        <div class="input-group">
                            <input type="number" class="form-control" name="contractConditionRequestList[${conditionIndex}].amount" placeholder="금액" required>
                            <span class="input-group-text">원</span>
                        </div>
                    </div>
                    <div class="col-md-1">
                        <button type="button" class="btn btn-soft-danger btn-icon btn-sm" onclick="removeCondition(this)">
                            <i class="ti ti-minus"></i>
                        </button>
                    </div>
                `;
                container.appendChild(newRow);
                conditionIndex++;
            }

            function removeCondition(btn) {
                btn.closest('.condition-row').remove();
            }

            // Bootstrap Validation Loop
            (function () {
                'use strict'
                
                var forms = document.querySelectorAll('.needs-validation')
                
                Array.prototype.slice.call(forms)
                    .forEach(function (form) {
                        form.addEventListener('submit', function (event) {
                            if (!form.checkValidity()) {
                                event.preventDefault()
                                event.stopPropagation()
                            }
                            
                            form.classList.add('was-validated')
                        }, false)
                    })
            })()
        </script>
    </th:block>
</body>
</html>
