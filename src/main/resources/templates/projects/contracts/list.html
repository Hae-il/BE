<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/vertical}">
<head>
    <th:block layout:fragment="page-meta" th:replace="~{partials/page-meta :: page-meta('수임 관리')}" />
    <style>
        .status-select {
            color: #000;
            border: 1px solid #ced4da;
            font-weight: 500;
        }
        .status-awaiting {
            background-color: #fff3cd !important;
            color: #856404 !important;
        }
        .status-pending {
            background-color: #cff4fc !important;
            color: #055160 !important;
        }
        .status-completed {
            background-color: #d1e7dd !important;
            color: #0f5132 !important;
        }
    </style>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="container-fluid">
            <th:block th:replace="~{partials/page-title :: page-title('수임 관리','Projects')}" />

            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header border-0 justify-content-between pb-0">
                            <div class="d-flex align-items-center gap-2">
                                <!-- Status Filter -->
                                <form action="/contracts" method="get" id="filterForm">
                                <div class="app-search">
                                        <select name="status" class="form-select form-control" onchange="this.form.submit()">
                                            <option value="">전체 상태</option>
                                                <option value="AWAITING" th:selected="${param.status != null and param.status[0] == 'AWAITING'}">수임대기</option>
                                            <option value="PENDING" th:selected="${param.status != null and param.status[0] == 'PENDING'}">입금대기</option>
                                            <option value="COMPLETED" th:selected="${param.status != null and param.status[0] == 'COMPLETED'}">입금완료</option>
                                    </select>
                                </div>
                                </form>
                            </div>
                        </div>

                        <div class="table-responsive mt-3">
                            <table class="table table-custom table-centered table-hover w-100 mb-0">
                                <thead class="bg-light bg-opacity-50">
                                    <tr>
                                        <th>사건번호</th>
                                        <th>의뢰인명</th>
                                        <th>담당 변호사</th>
                                        <th>수임 상태</th>
                                        <th>수임계약서</th>
                                        <th>입금기한</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="contract : ${contracts}">
                                        <td th:text="${contract.caseNumber}" class="fw-bold text-primary">C-001</td>
                                        <td th:text="${contract.clientName}" class="fw-bold">홍길동</td>
                                        <td th:text="${contract.attorneyName}">김변호사</td>
                                        <td>
                                            <select class="form-select form-select-sm status-select"
                                                    style="width: 140px;"
                                                    th:data-id="${contract.contractId}"
                                                    th:disabled="${contract.contractId == null or !#authorization.expression('hasAnyRole(''ACCOUNT'', ''ADMIN'')')}"
                                                    th:classappend="${contract.status != null ? 
                                                        (contract.status.name() == 'AWAITING' ? 'status-awaiting' : 
                                                        (contract.status.name() == 'PENDING' ? 'status-pending' : 
                                                        (contract.status.name() == 'COMPLETED' ? 'status-completed' : ''))) 
                                                        : 'bg-light'}"
                                                    onchange="updateContractStatus(this)">
                                                <option value="AWAITING" th:selected="${contract.status != null and contract.status.name() == 'AWAITING'}" class="bg-white text-dark">수임대기</option>
                                                <option value="PENDING" th:selected="${contract.status != null and contract.status.name() == 'PENDING'}" class="bg-white text-dark">입금대기</option>
                                                <option value="COMPLETED" th:selected="${contract.status != null and contract.status.name() == 'COMPLETED'}" class="bg-white text-dark">입금완료</option>
                                                <option th:if="${contract.contractId == null}" selected class="bg-white text-dark">미작성</option>
                                            </select>
                                        </td>
                                        <td>
                                            <th:block th:if="${contract.contractId == null}">
                                                <a th:if="${#authorization.expression('hasAnyRole(''SECRETARY'', ''ADMIN'', ''ACCOUNT'')')}"
                                                   th:href="@{/contracts/new(caseId=${contract.caseId}, caseNumber=${contract.caseNumber})}" 
                                                   class="btn btn-sm btn-soft-primary">작성</a>
                                                <button th:unless="${#authorization.expression('hasAnyRole(''SECRETARY'', ''ADMIN'', ''ACCOUNT'')')}"
                                                        type="button" class="btn btn-sm btn-light disabled" disabled>작성</button>
                                            </th:block>
                                            <a th:unless="${contract.contractId == null}" 
                                               th:href="@{|/contracts/${contract.contractId}|}" 
                                               class="btn btn-sm btn-soft-info">보기</a>
                                        </td>
                                        <td th:text="${contract.dueDate}">-</td>
                                    </tr>
                                    <tr th:if="${contracts.empty}">
                                        <td colspan="7" class="text-center py-4">데이터가 없습니다.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="card-footer border-0 py-3" th:if="${!contracts.empty}">
                           <ul class="pagination justify-content-end mb-0" 
                               th:with="start=${T(java.lang.Math).floor(contracts.number/10)*10 + 1},
                                        last=(${start + 9 < contracts.totalPages ? start + 9 : contracts.totalPages})">
                                <li class="page-item" th:classappend="${contracts.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/contracts(page=${contracts.number - 1}, attorneyName=${param.attorneyName}, status=${param.status})}" tabindex="-1">
                                        <i class="ti ti-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="page: ${#numbers.sequence(start, last)}" th:classappend="${page == contracts.number + 1} ? 'active'">
                                    <a class="page-link" th:text="${page}" th:href="@{/contracts(page=${page - 1}, attorneyName=${param.attorneyName}, status=${param.status})}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${contracts.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/contracts(page=${contracts.number + 1}, attorneyName=${param.attorneyName}, status=${param.status})}">
                                        <i class="ti ti-chevron-right"></i>
                                    </a>
                                </li>
                           </ul>
                        </div>
                            </div>
                        </div>
                    </div>
        </div>
    </th:block>

    <th:block layout:fragment="javascripts">
        <script>
            function updateContractStatus(selectElement) {
                const contractId = selectElement.getAttribute('data-id');
                const newStatus = selectElement.value;
                
                const statusClasses = {
                    'AWAITING': 'status-awaiting',
                    'PENDING': 'status-pending',
                    'COMPLETED': 'status-completed'
                };

                fetch(`/contracts/${contractId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ contractStatus: newStatus })
                })
                .then(response => {
                    if (response.ok) {
                        // Remove all status classes first
                        selectElement.classList.remove('status-awaiting', 'status-pending', 'status-completed', 'bg-light');
                        // Add new class
                        if (statusClasses[newStatus]) {
                            selectElement.classList.add(statusClasses[newStatus]);
                        }
                        alert('상태가 변경되었습니다.');
                    } else {
                        alert('상태 변경에 실패했습니다.');
                        location.reload();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                    location.reload();
                });
            }
        </script>
    </th:block>
</body>
</html>
