<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/vertical}">
<head>
    <th:block layout:fragment="page-meta" th:replace="~{partials/page-meta :: page-meta('정산 관리')}" />
    <style>
        .status-select {
            color: #000;
            border: 1px solid #ced4da;
            font-weight: 500;
        }
        .status-pending {
            background-color: #cff4fc !important;
            color: #055160 !important;
        }
        .status-completed {
            background-color: #d1e7dd !important;
            color: #0f5132 !important;
        }
        .status-draft {
            background-color: #f8f9fa !important;
            color: #6c757d !important;
        }
    </style>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="container-fluid">
            <th:block th:replace="~{partials/page-title :: page-title('정산 관리','Projects')}" />

            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header border-0 justify-content-between pb-0">
                            <div class="d-flex align-items-center gap-2">
                                <!-- Status Filter -->
                                <form action="/settlements" method="get" id="filterForm">
                                <div class="app-search">
                                        <select name="status" class="form-select form-control" onchange="this.form.submit()">
                                            <option value="">전체 상태</option>
                                            <option value="PENDING" th:selected="${param.status != null and param.status[0] == 'PENDING'}">입금대기</option>
                                            <option value="COMPLETED" th:selected="${param.status != null and param.status[0] == 'COMPLETED'}">입금완료</option>
                                    </select>
                                </div>
                                </form>
                            </div>
                        </div>

                        <div class="table-responsive mt-3">
                            <table class="table table-custom table-centered table-hover w-100 mb-0">
                                <thead class="bg-light bg-opacity-50">
                                    <tr>
                                        <th style="width: 10%;">사건번호</th>
                                        <th style="width: 10%;">의뢰인명</th>
                                        <th style="width: 10%;">담당 변호사</th>
                                        <th style="width: 15%;">상태</th>
                                        <th style="width: 15%;">정산서</th>
                                        <th style="width: 15%;">입금기한</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="settlement : ${settlements}">
                                        <td th:text="${settlement.caseNumber}" class="fw-bold text-primary">C-001</td>
                                        <td th:text="${settlement.clientName}" class="fw-bold">홍길동</td>
                                        <td th:text="${settlement.attorneyName}">김변호사</td>
                                        <td>
                                            <span th:if="${settlement.settlementId == null}" class="badge bg-light text-dark fs-5 p-2">미작성</span>
                                            
                                            <span th:if="${settlement.settlementId != null}">
                                                <select th:if="${settlement.settlementStatus != null and settlement.settlementStatus.name() == 'FINAL'}"
                                                        class="form-select form-select-sm status-select"
                                                        style="width: 140px;"
                                                        th:data-id="${settlement.settlementId}"
                                                        th:classappend="${settlement.paymentStatus != null ? 
                                                            (settlement.paymentStatus.name() == 'PENDING' ? 'status-pending' : 
                                                            (settlement.paymentStatus.name() == 'COMPLETED' ? 'status-completed' : '')) 
                                                            : 'bg-light'}"
                                                        th:disabled="${!#authorization.expression('hasAnyRole(''ACCOUNT'', ''ADMIN'')')}"
                                                        onchange="updateSettlementStatus(this)">
                                                    <option value="PENDING" th:selected="${settlement.paymentStatus != null and settlement.paymentStatus.name() == 'PENDING'}" class="bg-white text-dark">입금대기</option>
                                                    <option value="COMPLETED" th:selected="${settlement.paymentStatus != null and settlement.paymentStatus.name() == 'COMPLETED'}" class="bg-white text-dark">입금완료</option>
                                                </select>
                                                
                                                <span th:unless="${settlement.settlementStatus != null and settlement.settlementStatus.name() == 'FINAL'}"
                                                      class="badge bg-light text-secondary fs-5 p-2">작성중</span>
                                            </span>
                                        </td>
                                        <td>
                                            <a th:if="${settlement.settlementId == null}" 
                                               th:href="@{/settlements/new(caseId=${settlement.caseId}, caseNumber=${settlement.caseNumber})}" 
                                               class="btn btn-sm btn-soft-primary"
                                               th:classappend="${!#authorization.expression('hasAnyRole(''SECRETARY'', ''ADMIN'')') ? 'disabled' : ''}">작성</a>
                                            <a th:if="${settlement.settlementId != null and settlement.settlementStatus != null and settlement.settlementStatus.name() != 'FINAL'}" 
                                               th:href="@{|/settlements/${settlement.settlementId}/edit|}" 
                                               class="btn btn-sm btn-soft-warning"
                                               th:classappend="${!#authorization.expression('hasAnyRole(''SECRETARY'', ''ADMIN'')') ? 'disabled' : ''}">작성</a>
                                            <a th:if="${settlement.settlementId != null and settlement.settlementStatus != null and settlement.settlementStatus.name() == 'FINAL'}" 
                                               th:href="@{|/settlements/${settlement.settlementId}|}" 
                                               class="btn btn-sm btn-soft-info">보기</a>
                                        </td>
                                        <td th:text="${settlement.paymentDueDate}">-</td>
                                    </tr>
                                    <tr th:if="${settlements.empty}">
                                        <td colspan="6" class="text-center py-4">데이터가 없습니다.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="card-footer border-0 py-3" th:if="${!settlements.empty}">
                           <ul class="pagination justify-content-end mb-0" 
                               th:with="start=${T(java.lang.Math).floor(settlements.number/10)*10 + 1},
                                        last=(${start + 9 < settlements.totalPages ? start + 9 : settlements.totalPages})">
                                <li class="page-item" th:classappend="${settlements.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/settlements(page=${settlements.number - 1}, attorneyName=${param.attorneyName}, status=${param.status})}" tabindex="-1">
                                        <i class="ti ti-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="page: ${#numbers.sequence(start, last)}" th:classappend="${page == settlements.number + 1} ? 'active'">
                                    <a class="page-link" th:text="${page}" th:href="@{/settlements(page=${page - 1}, attorneyName=${param.attorneyName}, status=${param.status})}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${settlements.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/settlements(page=${settlements.number + 1}, attorneyName=${param.attorneyName}, status=${param.status})}">
                                        <i class="ti ti-chevron-right"></i>
                                    </a>
                                </li>
                           </ul>
                        </div>
                            </div>
                        </div>
                    </div>
        </div>
    </th:block>

    <th:block layout:fragment="javascripts">
        <script>
            function updateSettlementStatus(selectElement) {
                const settlementId = selectElement.getAttribute('data-id');
                const newStatus = selectElement.value;
                
                const statusClasses = {
                    'PENDING': 'status-pending',
                    'COMPLETED': 'status-completed'
                };

                fetch(`/settlements/${settlementId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ paymentStatus: newStatus })
                })
                .then(response => {
                    if (response.ok) {
                        // Remove all status classes first
                        selectElement.classList.remove('status-pending', 'status-completed', 'bg-light');
                        // Add new class
                        if (statusClasses[newStatus]) {
                            selectElement.classList.add(statusClasses[newStatus]);
                        }
                        alert('상태가 변경되었습니다.');
                    } else {
                        alert('상태 변경에 실패했습니다.');
                        location.reload();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                    location.reload();
                });
            }
        </script>
    </th:block>
</body>
</html>
