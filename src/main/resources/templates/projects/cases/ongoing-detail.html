<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/vertical}">
<head>
    <th:block layout:fragment="page-meta" th:replace="~{partials/page-meta :: page-meta('사건 상세정보')}" />
</head>
<body>
    <th:block layout:fragment="content">
        <div class="container-fluid">
            <th:block th:replace="~{partials/page-title :: page-title('사건 상세정보', '사건 관리')}" />

            <div class="row justify-content-center">
                <div class="col-xxl-10">
                    <form id="caseForm" th:action="@{/cases/ongoing/{id}/update(id=${case.caseId})}" method="post">
                        <div class="row g-0">
                            <div class="col-xl-9">
                                <div class="card card-h-100 rounded-0 rounded-start">
                                    <div class="card-header align-items-start p-4">
                                        <div class="d-flex align-items-center w-100">
                                            <div class="avatar-xxl me-3">
                                            </div>
                                            <div class="flex-grow-1">
                                                <input type="text" class="form-control-plaintext fs-xl fw-bold mb-2 editable-input" name="title" th:value="${case.title}" placeholder="사건명" readonly>
                                                <p class="text-muted mb-2 fs-xxs" th:text="'마지막 수정: ' + ${#temporals.format(case.modifiedDate, 'MM월 dd일 HH:mm')}"></p>
                                                <div class="d-flex align-items-center gap-2">
                                                    <span class="badge badge-soft-success fs-xxs badge-label" th:text="${case.caseStatus.label}">상태</span>
                                                </div>
                                            </div>
                                            <div class="ms-auto">
                                                <button type="button" id="btn-edit" class="btn btn-light" onclick="enableEditMode()">
                                                    <i class="ti ti-pencil me-1"></i> 수정
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card-body px-4">
                                        <div class="mb-4">
                                            <h5 class="fs-base mb-3">사건 기본 정보</h5>
                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <label class="form-label text-muted text-uppercase fs-xs">사건 번호</label>
                                                    <p class="fw-medium mb-0 text-primary" th:text="${case.caseNumber != null ? case.caseNumber : '미발급'}"></p>
                                                </div>
                                                <div class="col-md-6">
                                                    <label class="form-label text-muted text-uppercase fs-xs">발생 일시</label>
                                                    <input type="datetime-local" class="form-control editable-field" name="occurredDate" 
                                                           th:value="${case.occurredDate != null ? #temporals.format(case.occurredDate, 'yyyy-MM-dd''T''HH:mm') : ''}" readonly>
                                                </div>
                                            </div>
                                            <div class="row mb-3">
                                                <div class="col-md-6">
                                                    <label class="form-label text-muted text-uppercase fs-xs">사건 유형</label>
                                                    <select class="form-select editable-field" name="caseType" disabled>
                                                        <option value="CIVIL" th:selected="${case.caseType.name() == 'CIVIL'}">민사</option>
                                                        <option value="CRIMINAL" th:selected="${case.caseType.name() == 'CRIMINAL'}">형사</option>
                                                        <option value="TRAFFIC_ACCIDENT" th:selected="${case.caseType.name() == 'TRAFFIC_ACCIDENT'}">교통사고</option>
                                                        <option value="OTHER" th:selected="${case.caseType.name() == 'OTHER'}">기타</option>
                                                    </select>
                                                </div>
                                            </div>

                                            <hr class="my-4">

                                            <h5 class="fs-base mb-3">상대방 정보</h5>
                                            <div class="row mb-3">
                                                <div class="col-md-4">
                                                    <label class="form-label text-muted text-uppercase fs-xs">이름</label>
                                                    <input type="text" class="form-control-plaintext editable-input" name="opponentName" th:value="${case.opponentName ?: '미입력'}" placeholder="상대방 이름" readonly>
                                                </div>
                                                <div class="col-md-4">
                                                    <label class="form-label text-muted text-uppercase fs-xs">연락처</label>
                                                    <input type="text" class="form-control-plaintext editable-input" name="opponentPhone" th:value="${case.opponentPhone ?: '미입력'}" placeholder="010-0000-0000" readonly>
                                                    <div class="form-text fs-xs text-muted mt-1">'-'를 포함하여 입력해주세요.</div>
                                                </div>
                                                <div class="col-md-4">
                                                    <label class="form-label text-muted text-uppercase fs-xs">보험사</label>
                                                    <input type="text" class="form-control-plaintext editable-input" name="opponentInsurance" th:value="${case.opponentInsurance ?: '미입력'}" placeholder="상대방 보험사" readonly>
                                                </div>
                                            </div>

                                            <hr class="my-4">

                                            <h5 class="fs-base mb-2">사건 내용</h5>
                                            <textarea class="form-control-plaintext editable-input" name="content" rows="5" th:text="${case.content}" readonly></textarea>
                                            
                                            <hr class="my-4">

                                            <div class="d-flex align-items-center justify-content-between mb-3">
                                                <h5 class="fs-base mb-0">소송 문서</h5>
                                                <button type="button" class="btn btn-sm btn-soft-primary" data-bs-toggle="modal" data-bs-target="#documentUploadModal">
                                                    <i class="ti ti-upload me-1"></i> 업로드
                                                </button>
                                            </div>
                                            <div class="table-responsive mb-4">
                                                <table class="table table-sm table-centered table-nowrap mb-0">
                                                    <thead class="bg-light">
                                                        <tr>
                                                            <th scope="col" style="width: 15%;">구분</th>
                                                            <th scope="col">파일명</th>
                                                            <th scope="col">설명</th>
                                                            <th scope="col" style="width: 10%;">관리</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr th:each="doc : ${case.documents}">
                                                            <td><span class="badge badge-soft-info" th:text="${doc.documentType.label}"></span></td>
                                                            <td>
                                                                <a th:href="${doc.fileUrl}" target="_blank" class="text-reset text-decoration-underline">
                                                                    <i class="ti ti-file me-1"></i>
                                                                    <span th:text="${doc.originalFilename}"></span>
                                                                </a>
                                                            </td>
                                                            <td th:text="${doc.description}"></td>
                                                            <td>
                                                                <button type="button" class="btn btn-sm btn-ghost-danger btn-icon" 
                                                                        th:onclick="|deleteDocument(${case.caseId}, ${doc.documentId})|">
                                                                    <i class="ti ti-trash"></i>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                        <tr th:if="${#lists.isEmpty(case.documents)}">
                                                            <td colspan="4" class="text-center text-muted py-3">
                                                                등록된 소송 문서가 없습니다.
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>

                                            <hr class="my-4">

                                            <div class="d-flex align-items-center justify-content-between mb-3">
                                                <h5 class="fs-base mb-0">사건 진행사항</h5>
                                                <button type="button" class="btn btn-sm btn-soft-primary" data-bs-toggle="modal" data-bs-target="#eventModal">
                                                    <i class="ti ti-plus me-1"></i> 추가
                                                </button>
                                            </div>
                                            <div class="table-responsive">
                                                <table class="table table-sm table-centered table-nowrap mb-0">
                                                    <thead class="bg-light">
                                                        <tr>
                                                            <th scope="col">날짜</th>
                                                            <th scope="col">구분</th>
                                                            <th scope="col">장소</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <tr th:each="event : ${case.caseProgress}">
                                                            <td th:text="${#temporals.format(event.date, 'yyyy-MM-dd HH:mm')}"></td>
                                                            <td th:text="${event.eventType.label}"></td>
                                                            <td th:text="${event.location}"></td>
                                                        </tr>
                                                        <tr th:if="${#lists.isEmpty(case.caseProgress)}">
                                                            <td colspan="3" class="text-center text-muted py-3">
                                                                등록된 진행사항이 없습니다.
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-xl-3">
                                <div class="card card-h-100 rounded-0 rounded-end">
                                    <div class="card-body p-0">
                                        <div class="p-3 border-bottom border-dashed">
                                            <h5 class="mb-3">사건 수행</h5>
                                            <div class="d-grid gap-2">
                                                <!-- 소장 작성/보기 -->
                                                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#petitionModal">
                                                    <i class="ti ti-file-text me-1"></i> 
                                                    <span th:text="${case.petition != null ? '소장 보기/수정' : '소장 작성'}"></span>
                                                </button>
                                                
                                                <!-- 소송문서 업로드 -->
                                                <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#documentUploadModal">
                                                    <i class="ti ti-upload me-1"></i> 소송문서 업로드
                                                </button>

                                                <a href="/cases/ongoing" class="btn btn-light mt-2">
                                                    <i class="ti ti-arrow-left me-1"></i> 목록으로
                                                </a>
                                            </div>
                                        </div>

                                        <div class="p-3 border-bottom border-dashed">
                                            <h5 class="mb-2">담당 변호사</h5>
                                            <div class="d-flex align-items-center py-1 gap-2">
                                                <div class="avatar avatar-sm">
                                                    <span class="avatar-title bg-primary text-white rounded-circle">
                                                        <i class="ti ti-user"></i>
                                                    </span>
                                                </div>
                                                <div>
                                                    <h5 class="text-nowrap mb-0 lh-base" th:text="${case.attorneyName}"></h5>
                                                    <p class="text-muted fs-xxs mb-0" th:text="${case.attorneyEmail}"></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- 소장 작성/수정 모달 -->
        <div class="modal fade" id="petitionModal" tabindex="-1" aria-labelledby="petitionModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="petitionModalLabel" th:text="${case.petition != null ? '소장 보기/수정' : '소장 작성'}">소장 작성</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="petitionForm" th:action="${case.petition != null} ? @{/cases/ongoing/{id}/petition/update(id=${case.caseId})} : @{/cases/ongoing/{id}/petition(id=${case.caseId})}" method="post">
                        <div class="modal-body">
                            <div class="mb-3 d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-info btn-sm" id="btn-ai-draft">
                                    <i class="ti ti-robot me-1"></i> AI 초안 생성
                                </button>
                                <button type="button" class="btn btn-secondary btn-sm" onclick="submitAiReview()">
                                    <i class="ti ti-gavel me-1"></i> AI 법률 검토
                                </button>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">청구 금액</label>
                                    <input type="number" class="form-control" name="claimAmount" placeholder="금액 입력" th:value="${case.petition?.claimAmount}">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">청구 취지</label>
                                <textarea class="form-control" name="claimContent" rows="3" th:text="${case.petition?.claimContent}"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">사고 경위 (청구 원인)</label>
                                <textarea class="form-control" name="accidentCircumstances" rows="3" th:text="${case.petition?.accidentCircumstances}"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">손해 항목</label>
                                <textarea class="form-control" name="damageItems" rows="2" th:text="${case.petition?.damageItems}"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">손해액 산정</label>
                                <textarea class="form-control" name="damageCalculation" rows="2" th:text="${case.petition?.damageCalculation}"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">책임 인정 근거</label>
                                <textarea class="form-control" name="liabilityBasis" rows="2" th:text="${case.petition?.liabilityBasis}"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">입증 방법</label>
                                <textarea class="form-control" name="proofMethod" rows="2" th:text="${case.petition?.proofMethod}"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">첨부 서류</label>
                                <textarea class="form-control" name="attachedDocuments" rows="2" th:text="${case.petition?.attachedDocuments}"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn btn-primary">저장</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- 소송문서 업로드 모달 -->
        <div class="modal fade" id="documentUploadModal" tabindex="-1" aria-labelledby="documentUploadModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="documentUploadModalLabel">소송문서 업로드</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/cases/ongoing/{id}/documents(id=${case.caseId})}" method="post" enctype="multipart/form-data">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">문서 구분</label>
                                <select class="form-select" name="documentType" required>
                                    <option value="">선택하세요</option>
                                    <option value="ANSWER">답변서</option>
                                    <option value="PREPARATORY_BRIEF">준비서면</option>
                                    <option value="EVIDENCE">증거자료</option>
                                    <option value="JUDGEMENT">판결문</option>
                                    <option value="ETC">기타</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">파일 선택</label>
                                <input type="file" class="form-control" name="file" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">설명</label>
                                <textarea class="form-control" name="description" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn btn-primary">업로드</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 사건 진행사항 추가 모달 -->
        <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="eventModalLabel">사건 진행사항 추가</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/cases/ongoing/{id}/events(id=${case.caseId})}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">날짜 및 시간</label>
                                <input type="datetime-local" class="form-control" name="date" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">구분</label>
                                <select class="form-select" name="eventType" required>
                                    <option value="">선택하세요</option>
                                    <option value="HEARING_DATE">변론기일</option>
                                    <option value="TRIAL_DATE">공판일</option>
                                    <option value="MEDIATION_DATE">조정기일</option>
                                    <option value="CONFERENCE_DATE">준비기일</option>
                                    <option value="SENTENCE_DATE">선고기일</option>
                                    <option value="INVESTIGATION_DATE">조사기일</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">장소</label>
                                <input type="text" class="form-control" name="location" placeholder="예: 서울중앙지방법원 제3별관 202호">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">취소</button>
                            <button type="submit" class="btn btn-primary">추가</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 문서 삭제용 히든 폼 -->
        <form id="deleteDocumentForm" method="post"></form>
        
        <!-- AI 법률 검토용 히든 폼 -->
        <form id="aiReviewForm" method="post"></form>

        <script th:inline="javascript">
            function submitAiReview() {
                const caseId = [[${case.caseId}]];
                // 소장이 저장되어 있는지 확인 (간단히 check if petition exists in model, or simple alert)
                // 여기서는 그냥 보냅니다. 서비스에서 없으면 에러가 날 것입니다.
                // 사용자 경험을 위해 저장 여부를 묻는 것이 좋을 수 있습니다.
                if (confirm('현재 저장된 소장 내용을 바탕으로 법률 검토를 진행합니다.\n소장 내용을 수정하셨다면 먼저 [저장] 버튼을 눌러주세요.\n계속 진행하시겠습니까?')) {
                    const form = document.getElementById('aiReviewForm');
                    form.action = '/ai/review/' + caseId;
                    form.submit();
                }
            }

            function deleteDocument(caseId, docId) {
                if (confirm('정말 삭제하시겠습니까?')) {
                    const form = document.getElementById('deleteDocumentForm');
                    form.action = '/cases/ongoing/' + caseId + '/documents/' + docId + '/delete';
                    form.submit();
                }
            }

            document.addEventListener('DOMContentLoaded', function() {
                const btnAiDraft = document.getElementById('btn-ai-draft');
                const caseId = [[${case.caseId}]];
                
                if(btnAiDraft) {
                    btnAiDraft.addEventListener('click', function() {
                        // Show loading state
                        const originalText = this.innerHTML;
                        this.disabled = true;
                        this.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> 생성 중...';
                        
                        fetch('/ai/api/petition/draft', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ caseId: caseId })
                        })
                        .then(response => response.json())
                        .then(data => {
                            // Populate form fields
                            const form = document.getElementById('petitionForm');
                            if(data.claimAmount) form.querySelector('[name="claimAmount"]').value = data.claimAmount;
                            if(data.claimContent) form.querySelector('[name="claimContent"]').value = data.claimContent;
                            if(data.accidentCircumstances) form.querySelector('[name="accidentCircumstances"]').value = data.accidentCircumstances;
                            if(data.damageItems) form.querySelector('[name="damageItems"]').value = data.damageItems;
                            if(data.damageCalculation) form.querySelector('[name="damageCalculation"]').value = data.damageCalculation;
                            if(data.liabilityBasis) form.querySelector('[name="liabilityBasis"]').value = data.liabilityBasis;
                            if(data.proofMethod) form.querySelector('[name="proofMethod"]').value = data.proofMethod;
                            if(data.attachedDocuments) form.querySelector('[name="attachedDocuments"]').value = data.attachedDocuments;
                            
                            alert('AI 초안이 생성되었습니다.');
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('초안 생성 중 오류가 발생했습니다.');
                        })
                        .finally(() => {
                            this.disabled = false;
                            this.innerHTML = originalText;
                        });
                    });
                }
            });
            
            function enableEditMode() {
                // Text inputs and textareas
                document.querySelectorAll('.editable-input').forEach(el => {
                    el.readOnly = false;
                    el.classList.remove('form-control-plaintext');
                    el.classList.add('form-control');
                    if (el.value === '미입력') el.value = '';
                });

                // Selects and date inputs
                document.querySelectorAll('.editable-field').forEach(el => {
                    el.disabled = false;
                    el.readOnly = false;
                });

                const btn = document.getElementById('btn-edit');
                btn.className = 'btn btn-success';
                btn.innerHTML = '<i class="ti ti-device-floppy me-1"></i> 저장';
                btn.onclick = submitForm;
            }

            function submitForm() {
                document.getElementById('caseForm').submit();
            }
        </script>
    </th:block>
</body>
</html>
