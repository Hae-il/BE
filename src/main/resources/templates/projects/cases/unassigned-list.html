<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/vertical}">
<head>
    <th:block layout:fragment="page-meta" th:replace="~{partials/page-meta :: page-meta('미배정 사건')}" />
</head>
<body>
    <th:block layout:fragment="content">
        <div class="container-fluid">
            <th:block th:replace="~{partials/page-title :: page-title('미배정 사건', '사건 관리')}" />

            <div class="row">
                <div class="col-12">
                    <div data-table data-table-rows-per-page="8" class="card">
                        <!-- Search, Filter, Sort ... -->
                        <div class="card-header border-0 justify-content-between pb-0">
                            <div class="d-flex align-items-center gap-2">
                                <!-- Case Type Filter -->
                                <form action="/cases/unassigned" method="get">
                                    <div class="app-search">
                                        <select name="caseType" class="form-select form-control" onchange="this.form.submit()">
                                            <option value="">전체 유형</option>
                                            <option value="CIVIL" th:selected="${param.caseType != null and param.caseType[0] == 'CIVIL'}">민사</option>
                                            <option value="CRIMINAL" th:selected="${param.caseType != null and param.caseType[0] == 'CRIMINAL'}">형사</option>
                                            <option value="TRAFFIC_ACCIDENT" th:selected="${param.caseType != null and param.caseType[0] == 'TRAFFIC_ACCIDENT'}">교통사고</option>
                                            <option value="OTHER" th:selected="${param.caseType != null and param.caseType[0] == 'OTHER'}">기타</option>
                                        </select>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- Contents -->
                        <div class="table-responsive mt-3">
                            <table class="table table-custom table-centered table-hover w-100 mb-0">
                                <thead class="bg-light bg-opacity-50">
                                    <tr>
                                        <th>사건번호</th>
                                        <th>의뢰인</th>
                                        <th>사건명</th>
                                        <th>사건유형</th>
                                        <th>담당 변호사</th>
                                        <th>상태</th>
                                        <th>발생일시</th>
                                    </tr>
                                </thead>
                                <tbody style="cursor: pointer;">
                                    <tr th:each="case : ${cases}"
                                        th:data-href="@{/cases/unassigned/{id}(id=${case.caseId})}"
                                        onclick="if(!['A'].includes(event.target.tagName)) location.href=this.getAttribute('data-href')">
                                        <td>
                                                <div>
                                                <a th:href="@{/cases/unassigned/{id}(id=${case.caseId})}" class="fw-bold text-primary" th:text="'C' + ${case.caseId}"></a>
                                                <br>
                                                <small class="text-muted" th:text="'등록: ' + (${case.createdDate != null} ? ${#temporals.format(case.createdDate, 'yyyy-MM-dd')} : '-')"></small>
                                            </div>
                                        </td>
                                        <td th:text="${case.clientName}"></td>
                                        <td>
                                            <h5 class="mb-0 fs-14" th:text="${case.title}"></h5>
                                        </td>
                                        <td th:text="${case.caseType != null ? case.caseType.label : '-'}"></td>
                                        <td class="text-muted">-</td>
                                        <td>
                                            <span class="badge fs-xxs badge-label" 
                                                  th:text="${case.caseStatus != null ? case.caseStatus.label : '-'}"
                                                  th:classappend="${case.caseStatus != null && case.caseStatus.name() == 'IN_PROGRESS' ? 'badge-soft-success' : 
                                                                   case.caseStatus != null && case.caseStatus.name() == 'COMPLETED' ? 'badge-soft-primary' :
                                                                   'badge-soft-secondary'}"></span>
                                        </td>
                                        <td th:text="${case.occurredDate != null ? #temporals.format(case.occurredDate, 'yyyy-MM-dd HH:mm') : '-'}"></td>
                                    </tr>
                                    <tr th:if="${cases.empty}">
                                        <td colspan="7" class="text-center text-muted py-4">
                                            <span th:if="${param.caseType != null and param.caseType[0] != ''}">데이터가 없습니다.</span>
                                            <span th:unless="${param.caseType != null and param.caseType[0] != ''}">미배정 사건이 없습니다.</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="card-footer border-0 py-3" th:if="${!cases.empty}">
                           <ul class="pagination justify-content-end mb-0" 
                               th:with="start=${T(java.lang.Math).floor(cases.number/10)*10 + 1},
                                        last=(${start + 9 < cases.totalPages ? start + 9 : cases.totalPages})">
                                <li class="page-item" th:classappend="${cases.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/cases/unassigned(page=${cases.number - 1}, caseType=${param.caseType})}" tabindex="-1">
                                        <i class="ti ti-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="page: ${#numbers.sequence(start, last)}" th:classappend="${page == cases.number + 1} ? 'active'">
                                    <a class="page-link" th:text="${page}" th:href="@{/cases/unassigned(page=${page - 1}, caseType=${param.caseType})}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${cases.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/cases/unassigned(page=${cases.number + 1}, caseType=${param.caseType})}" tabindex="-1">
                                        <i class="ti ti-chevron-right"></i>
                                    </a>
                                </li>
                           </ul>
                        </div>
                            </div>
                        </div>
                    </div>
        </div>
    </th:block>
</body>
</html>
