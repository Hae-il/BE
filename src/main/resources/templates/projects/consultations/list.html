<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/vertical}">

<head>

    <th:block layout:fragment="page-meta" th:replace="~{partials/page-meta :: page-meta(${pageTitle})}" />

</head>

<body>
    <th:block layout:fragment="content">

        <div class="container-fluid">

            <th:block th:replace="~{partials/page-title :: page-title(${pageTitle},${pageSubtitle})}" />

            <div class="row">
                <div class="col-12">
                    <div data-table data-table-rows-per-page="8" class="card">
                        <!-- Search, Filter, Sort ... -->
                        <div class="card-header border-0 justify-content-between pb-0">
                            <div class="d-flex align-items-center gap-2">
                                <!-- Status Filter -->
                                <form action="/consultations" method="get" id="filterForm">
                                    <div class="app-search">
                                        <select name="status" class="form-select form-control" onchange="this.form.submit()">
                                            <option value="">전체 상태</option>
                                            <option value="IN_PROGRESS" th:selected="${param.status != null and param.status[0] == 'IN_PROGRESS'}">상담진행</option>
                                            <option value="COMPLETED" th:selected="${param.status != null and param.status[0] == 'COMPLETED'}">상담완료</option>
                                        </select>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- Contents -->
                        <div class="table-responsive mt-3">
                            <table class="table table-custom table-centered table-hover w-100 mb-0">
                                <thead class="bg-light bg-opacity-50">
                                    <tr>
                                        <th>상담번호</th>
                                        <th>의뢰인</th>
                                        <th>상태</th>
                                        <th>담당변호사</th>
                                        <th>상담일시</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dynamic Rows -->
                                    <tr th:each="consultation : ${consultations}"
                                        style="cursor: pointer;"
                                        th:onclick="|location.href='@{/consultations/{id}(id=${consultation.id})}'|">
                                        <td>
                                            <a th:text="'C' + ${consultation.id}" 
                                               th:href="'/consultations/' + ${consultation.id}" 
                                               class="fw-bold text-primary"></a>
                                            <br>
                                            <small class="text-muted" th:text="'등록: ' + ${#temporals.format(consultation.createdAt, 'yyyy-MM-dd')}"></small>
                                        </td>
                                        <td>
                                            <h5 class="mb-1" th:text="${consultation.clientName}"></h5>
                                        </td>
                                        <td>
                                            <span class="badge fs-xxs badge-label" 
                                                  th:text="${consultation.status.label}"
                                                  th:classappend="${consultation.status.name() == 'IN_PROGRESS' ? 'badge-soft-success' : 
                                                                   consultation.status.name() == 'COMPLETED' ? 'badge-soft-primary' :
                                                                   'badge-soft-secondary'}"></span>
                                        </td>
                                        <td th:text="${consultation.counselorName}"></td>
                                        <td th:text="${#temporals.format(consultation.consultationDate, 'yyyy-MM-dd HH:mm')}"></td>
                                    </tr>
                                    
                                    <!-- Empty State -->
                                    <tr th:if="${consultations.empty}">
                                        <td colspan="5" class="text-center text-muted py-4">
                                            <span th:if="${param.status != null and param.status[0] != ''}">데이터가 없습니다.</span>
                                            <span th:unless="${param.status != null and param.status[0] != ''}">상담 데이터가 없습니다.</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="card-footer border-0 py-3" th:if="${!consultations.empty}">
                           <ul class="pagination justify-content-end mb-0" 
                               th:with="start=${T(java.lang.Math).floor(consultations.number/10)*10 + 1},
                                        last=(${start + 9 < consultations.totalPages ? start + 9 : consultations.totalPages})">
                                <li class="page-item" th:classappend="${consultations.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/consultations(page=${consultations.number - 1}, status=${param.status})}" tabindex="-1">
                                        <i class="ti ti-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="page: ${#numbers.sequence(start, last)}" th:classappend="${page == consultations.number + 1} ? 'active'">
                                    <a class="page-link" th:text="${page}" th:href="@{/consultations(page=${page - 1}, status=${param.status})}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${consultations.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/consultations(page=${consultations.number + 1}, status=${param.status})}">
                                        <i class="ti ti-chevron-right"></i>
                                    </a>
                                </li>
                           </ul>
                        </div>

                    </div>

                </div><!-- end col -->
            </div><!-- end row -->

        </div>

    </th:block>

    <th:block layout:fragment="javascripts">
        <!-- Custom table script removed - not functional -->
    </th:block>

</body>

</html>
