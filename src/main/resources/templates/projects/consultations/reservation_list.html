<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/vertical}">

<head>

    <th:block layout:fragment="page-meta" th:replace="~{partials/page-meta :: page-meta(${pageTitle})}" />

</head>

<body>
    <th:block layout:fragment="content">

        <div class="container-fluid">

            <th:block th:replace="~{partials/page-title :: page-title(${pageTitle},${pageSubtitle})}" />

            <div class="row">
                <div class="col-12">
                    <div data-table data-table-rows-per-page="8" class="card">
                        <!-- Search, Filter, Sort ... -->
                        <div class="card-header border-0 justify-content-between pb-0">
                            <div class="d-flex align-items-center gap-2">
                                <!-- Status Filter -->
                                <form action="/consultations/reservations" method="get" id="filterForm">
                                    <div class="app-search">
                                        <select name="status" class="form-select form-control" onchange="this.form.submit()">
                                            <option value="">전체 상태</option>
                                            <option value="PENDING" th:selected="${param.status != null and param.status[0] == 'PENDING'}">예약대기</option>
                                            <option value="APPROVED" th:selected="${param.status != null and param.status[0] == 'APPROVED'}">예약승인</option>
                                            <option value="REJECTED" th:selected="${param.status != null and param.status[0] == 'REJECTED'}">예약거절</option>
                                        </select>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- Contents -->
                        <div class="table-responsive mt-3">
                            <table class="table table-custom table-centered table-hover w-100 mb-0">
                                <thead class="bg-light bg-opacity-50">
                                    <tr>
                                        <th>예약번호</th>
                                        <th>신청자</th>
                                        <th>상태</th>
                                        <th>담당변호사</th>
                                        <th>신청일시</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Dynamic Rows -->
                                    <tr th:each="reservation : ${reservations}" 
                                        style="cursor: pointer;" 
                                        th:onclick="|location.href='@{/consultations/reservations/{id}(id=${reservation.id})}'|">
                                        <td>
                                            <a th:text="'R' + ${reservation.id}" 
                                               th:href="'/consultations/reservations/' + ${reservation.id}" 
                                               class="fw-bold text-primary"></a>
                                            <br>
                                            <small class="text-muted" th:text="'신청: ' + ${#temporals.format(reservation.createdAt, 'yyyy-MM-dd')}"></small>
                                        </td>
                                        <td>
                                            <div>
                                                <h5 class="mb-1" th:text="${reservation.name}"></h5>
                                                <p class="text-muted mb-0 fs-xxs" th:text="${reservation.phone}"></p>
                                            </div>
                                        </td>
                                        <td>
                                            <span class="badge fs-xxs badge-label" 
                                                  th:text="${reservation.status.label}"
                                                  th:classappend="${reservation.status.name() == 'PENDING' ? 'badge-soft-warning' : 
                                                                   reservation.status.name() == 'APPROVED' ? 'badge-soft-success' :
                                                                   'badge-soft-danger'}"></span>
                                        </td>
                                        <td>
                                            <span th:if="${reservation.assignedLawyerName}" th:text="${reservation.assignedLawyerName}"></span>
                                            <span th:if="${reservation.assignedLawyerName == null}" class="text-muted fs-xxs">-</span>
                                        </td>
                                        <td th:text="${#temporals.format(reservation.requestedDate, 'yyyy-MM-dd HH:mm')}"></td>
                                    </tr>
                                    
                                    <!-- Empty State -->
                                    <tr th:if="${reservations.empty}">
                                        <td colspan="5" class="text-center text-muted py-4">
                                            <span th:if="${param.status != null and param.status[0] != ''}">데이터가 없습니다.</span>
                                            <span th:unless="${param.status != null and param.status[0] != ''}">예약 신청이 없습니다.</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="card-footer border-0 py-3" th:if="${!reservations.empty}">
                           <ul class="pagination justify-content-end mb-0" 
                               th:with="start=${T(java.lang.Math).floor(reservations.number/10)*10 + 1},
                                        last=(${start + 9 < reservations.totalPages ? start + 9 : reservations.totalPages})">
                                <li class="page-item" th:classappend="${reservations.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/consultations/reservations(page=${reservations.number - 1}, status=${param.status})}" tabindex="-1">
                                        <i class="ti ti-chevron-left"></i>
                                    </a>
                                </li>
                                <li class="page-item" th:each="page: ${#numbers.sequence(start, last)}" th:classappend="${page == reservations.number + 1} ? 'active'">
                                    <a class="page-link" th:text="${page}" th:href="@{/consultations/reservations(page=${page - 1}, status=${param.status})}">1</a>
                                </li>
                                <li class="page-item" th:classappend="${reservations.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/consultations/reservations(page=${reservations.number + 1}, status=${param.status})}">
                                        <i class="ti ti-chevron-right"></i>
                                    </a>
                                </li>
                           </ul>
                        </div>

                    </div>

                </div><!-- end col -->
            </div><!-- end row -->

        </div>

    </th:block>

    <th:block layout:fragment="javascripts">
        <!-- Custom table script removed - not functional -->
    </th:block>

</body>

</html>
