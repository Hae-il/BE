<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="topbar">

    <!-- Topbar Start -->
    <header class="app-topbar">
        <div class="container-fluid topbar-menu">
            <div class="d-flex align-items-center gap-2">
                <!-- Topbar Brand Logo -->
                <div class="logo-topbar">
                    <!-- Logo light -->
                    <a href="/" class="logo-light">
                    <span class="logo-lg">
                        <span class="fw-bold fs-22 text-white">Hae:il</span>
                    </span>
                        <span class="logo-sm">
                        <span class="fw-bold fs-22 text-white">H</span>
                    </span>
                    </a>

                    <!-- Logo Dark -->
                    <a href="/" class="logo-dark">
                    <span class="logo-lg">
                        <span class="fw-bold fs-22 text-dark">Hae:il</span>
                    </span>
                        <span class="logo-sm">
                        <span class="fw-bold fs-22 text-dark">H</span>
                    </span>
                    </a>
                </div>

                <!-- Sidebar Menu Toggle Button -->
                <button class="sidenav-toggle-button btn btn-primary btn-icon">
                    <i class="ti ti-menu-4 fs-22"></i>
                </button>

                <!-- Horizontal Menu Toggle Button -->
                <button class="topnav-toggle-button px-2" data-bs-toggle="collapse" data-bs-target="#topnav-menu-content">
                    <i class="ti ti-menu-4 fs-22"></i>
                </button>
            </div> <!-- .d-flex-->

            <div class="d-flex align-items-center gap-2">

                <!-- Notification Dropdown -->
                <div class="topbar-item">
                    <div class="dropdown">
                        <button class="topbar-link dropdown-toggle drop-arrow-none" data-bs-toggle="dropdown" data-bs-offset="0,22" type="button" data-bs-auto-close="outside" aria-haspopup="false" aria-expanded="false">
                            <i data-lucide="bell" class="fs-xxl"></i>
                            <span class="badge badge-square text-bg-warning topbar-badge d-none" id="notification-badge">0</span>
                        </button>

                        <div class="dropdown-menu p-0 dropdown-menu-end dropdown-menu-lg">
                            <div class="px-3 py-2 border-bottom">
                                <div class="row align-items-center">
                                    <div class="col">
                                        <h6 class="m-0 fs-md fw-semibold">Notifications</h6>
                                    </div>
                                    <div class="col text-end">
                                        <a href="#!" class="badge text-bg-light badge-label py-1" id="notification-count">0 Alerts</a>
                                    </div>
                                </div>
                            </div>

                            <div style="max-height: 300px; overflow-y: auto;" id="notification-list">
                                <!-- Notifications will be inserted here -->
                            </div> <!-- end dropdown-->

                            <!-- All-->
                            <a href="javascript:void(0);" class="dropdown-item text-center text-reset text-decoration-underline link-offset-2 fw-bold notify-item border-top border-light py-2" id="view-all-alerts">
                                View All Alerts
                            </a>

                        </div>
                    </div>
                </div>

                <!-- Light/Dark Mode Button -->
                <div class="topbar-item d-none d-sm-flex">
                    <button class="topbar-link" id="light-dark-mode" type="button">
                        <i data-lucide="moon" class="fs-xxl mode-light-moon"></i>
                        <i data-lucide="sun" class="fs-xxl mode-light-sun"></i>
                    </button>
                </div>

                <!-- User Dropdown -->
                <div class="topbar-item nav-user">
                    <div class="dropdown">
                        <a class="topbar-link dropdown-toggle drop-arrow-none px-2" data-bs-toggle="dropdown" data-bs-offset="0,16" href="#!" aria-haspopup="false" aria-expanded="false">
                            <span class="avatar-title bg-primary text-white rounded-circle fs-lg me-2" style="width: 32px; height: 32px;">
                                <i class="ti ti-user"></i>
                            </span>
                            <div class="d-lg-flex align-items-center gap-1 d-none">
                                <h5 class="my-0" th:text="${username ?: '사용자'}">사용자</h5>
                                <i class="ti ti-chevron-down align-middle"></i>
                            </div>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end">
                            <!-- Header -->
                            <div class="dropdown-header noti-title">
                                <h6 class="text-overflow m-0" th:text="'안녕하세요, ' + ${username ?: '사용자'} + '님!'">안녕하세요, 사용자님!</h6>
                                <small class="text-muted" th:text="${userRole ?: '직원'}">직원</small>
                            </div>

                            <!-- Logout -->
                            <a href="/auth/logout" class="dropdown-item text-danger fw-semibold">
                                <i class="ti ti-logout-2 me-2 fs-17 align-middle"></i>
                                <span class="align-middle">로그아웃</span>
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </header>
    <!-- Topbar End -->

</th:block>
</html>
